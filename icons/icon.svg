<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>

  <!-- Scroll icon (blocked) -->
  <g transform="translate(64, 64)">
    <!-- Scroll/document shape -->
    <rect x="-20" y="-30" width="40" height="60" rx="4" fill="white" opacity="0.9"/>

    <!-- Lines representing text -->
    <line x1="-12" y1="-20" x2="12" y2="-20" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="10" x2="12" y2="10" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>

    <!-- Block/prohibition symbol -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f44336" stroke-width="6"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#f44336" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
