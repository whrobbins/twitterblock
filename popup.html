<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      font-weight: 600;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(10px);
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.3);
      transition: 0.3s;
      border-radius: 26px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: rgba(76, 175, 80, 0.8);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .info {
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.9;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .info-title {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .info ul {
      margin: 6px 0;
      padding-left: 20px;
    }

    .info li {
      margin: 4px 0;
    }

    .status {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      padding: 8px;
      margin-top: 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <h1>📜 X Scroll Blocker</h1>

  <div class="container">
    <div class="toggle-container">
      <span class="toggle-label">Block Scrolling</span>
      <label class="switch">
        <input type="checkbox" id="enableToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="status" id="status">
      Scroll blocking is enabled
    </div>

    <div class="info">
      <div class="info-title">How it works:</div>
      <ul>
        <li>Blocks scrolling on X timeline</li>
        <li>Allows posting tweets</li>
        <li>Allows checking notifications</li>
        <li>Allows sending DMs</li>
      </ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
